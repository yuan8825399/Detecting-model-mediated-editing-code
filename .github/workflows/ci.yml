name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
          pip install -e .
      - name: Lint
        run: ruff check provenance analysis scripts tests
      - name: Tests
        run: pytest -q
      - name: Source-isolation audit
        run: python analysis/40_isolation_audit.py
      - name: Check audit output
        run: |
          python - <<'PY'
          import json
          r = json.load(open("results/isolation_audit.json"))
          assert r["n_protocols"] == 51, r
          assert r["n_with_overlap"] == 0, r
          print("audit ok:", r["n_protocols"], "protocols,", r["n_with_overlap"], "overlaps")
          PY
