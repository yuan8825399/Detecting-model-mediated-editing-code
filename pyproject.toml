[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "provenance-audit"
version = "1.0.0"
description = "Detection and provenance auditing of model-mediated editing in Chinese legal abstracts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "[Author 1]" }]
dependencies = [
  "numpy>=1.26.4",
  "pandas>=2.2",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
embeddings = ["torch>=2.2", "transformers>=4.40"]
docs = ["python-docx>=1.1"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/[owner]/provenance-audit"

[tool.setuptools]
packages = ["provenance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["dist"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"analysis/*" = ["E401", "E402", "E701", "E702", "E741", "F401"]
"exploratory/*" = ["E401", "E402", "E701", "E702", "E741", "F401", "F841"]
"scripts/make_docx.py" = ["E401", "E402", "E701", "E702"]
